<script>
// ==================================================================
// LOGIKA MODUL GALERI FOTO (FILE TERPISAH - BEBAS CHAR ILEGAL)
// ==================================================================

var rawGaleriData = [];
var isGaleriLoaded = false;

document.addEventListener('DOMContentLoaded', function () {
  var tglGaleri = document.getElementById('galeriTanggal');
  if (tglGaleri) tglGaleri.value = new Date().toISOString().split('T')[0];
});

function getFormattedImageUrl(url) {
  if (!url) return "https://placehold.co/400x200/cccccc/ffffff?text=No+Image";
  if (url.indexOf("drive.google.com") !== -1) {
    var match = url.match(/\/d\/([^/=]+)/);
    if (match && match[1]) return "https://lh3.googleusercontent.com/d/" + match[1];
  }
  return url;
}

function loadGaleriData() {
  var container = document.getElementById('galeriGridContainer');
  if (!container) return;

  if (!isGaleriLoaded) {
    container.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="fa-solid fa-spinner fa-spin me-2"></i>Memuat galeri foto...</div>';
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        var msg = (res && res.message) ? res.message : 'Gagal memuat data dari spreadsheet';
        container.innerHTML = '<div class="col-12 text-center text-danger py-5">' + msg + '</div>';
        return;
      }
      rawGaleriData = res.list || [];
      isGaleriLoaded = true;
      renderGaleriCards(rawGaleriData);
    })
    .withFailureHandler(function (err) {
      container.innerHTML = '<div class="col-12 text-center text-danger py-5">Gagal memuat galeri: ' + err.message + '</div>';
    })
    .getGaleriData();
}

function renderGaleriCards(dataList) {
  var container = document.getElementById('galeriGridContainer');
  if (!container) return;

  if (!dataList || dataList.length === 0) {
    container.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="fa-regular fa-images fa-3x mb-3 d-block"></i>Belum ada foto yang diunggah ke galeri.</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < dataList.length; i++) {
    var item = dataList[i];
    var imgUrl = getFormattedImageUrl(item.url);
    var kategori = item.kategori || 'Umum';
    var deskripsi = item.deskripsi || '-';
    var judul = item.judul || '-';

    html += '<div class="col-sm-6 col-md-4 col-lg-3 mb-3" id="galeri-card-' + item.rowIndex + '">' +
      '<div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden position-relative group-card">' +
        '<div style="height: 160px; overflow: hidden; background-color: #e9ecef;" class="position-relative">' +
          '<img src="' + imgUrl + '" loading="lazy" decoding="async" class="w-100 h-100" style="object-fit: cover; cursor: pointer;" onclick="openPreviewFotoModal(' + i + ')" onerror="this.onerror=null; this.src=\'https://placehold.co/400x200/cccccc/ffffff?text=Error+Gambar\';">' +
          '<span class="badge bg-info text-white position-absolute top-0 start-0 m-2 px-2 py-1" style="font-size: 0.75rem;">' + kategori + '</span>' +
        '</div>' +
        '<div class="card-body p-3 d-flex flex-column justify-content-between">' +
          '<div>' +
            '<h6 class="fw-bold text-dark text-truncate mb-1" title="' + judul + '">' + judul + '</h6>' +
            '<p class="text-muted small mb-2 text-truncate-2" style="font-size: 0.8rem; min-height: 2.4em;">' + deskripsi + '</p>' +
          '</div>' +
          '<div class="d-flex justify-content-between align-items-center border-top pt-2 mt-2" style="font-size: 0.75rem;">' +
            '<span class="text-muted"><i class="fa-regular fa-calendar me-1"></i>' + item.tanggal + '</span>' +
            '<button type="button" class="btn btn-link text-danger p-0 border-0" onclick="confirmDeleteGaleri(' + item.rowIndex + ')" title="Hapus Foto">' +
              '<i class="fa-solid fa-trash-can"></i>' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  container.innerHTML = html;
}

function confirmDeleteGaleri(rowIndex) {
  // Pengecekan SweetAlert2
  if (typeof Swal !== 'undefined') {
    Swal.fire({
      title: 'Hapus Foto Ini?',
      text: "Foto yang dihapus tidak dapat dikembalikan!",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#dc3545', // Merah elegan untuk aksi berbahaya
      cancelButtonColor: '#6c757d',  // Abu-abu netral
      confirmButtonText: '<i class="fa-solid fa-trash-can me-1"></i> Ya, Hapus!',
      cancelButtonText: 'Batal',
      reverseButtons: true,
      customClass: {
        popup: 'rounded-4 shadow-lg border-0',
        confirmButton: 'px-4 py-2 rounded-3 fw-bold',
        cancelButton: 'px-4 py-2 rounded-3'
      }
    }).then(function (result) {
      if (result.isConfirmed) {
        // Tampilkan loading spinner yang modern
        Swal.fire({
          title: 'Menghapus Foto...',
          text: 'Mohon tunggu sebentar',
          allowOutsideClick: false,
          didOpen: function () {
            Swal.showLoading();
          }
        });

        // Efek visual langsung pada kartu foto
        var cardElem = document.getElementById('galeri-card-' + rowIndex);
        if (cardElem) cardElem.style.opacity = '0.3';

        // Panggil fungsi hapus di server
        google.script.run
          .withSuccessHandler(function (res) {
            if (res && res.success) {
              Swal.fire({
                icon: 'success',
                title: 'Terhapus!',
                text: res.message || 'Foto berhasil dihapus dari galeri.',
                timer: 1500,
                showConfirmButton: false,
                customClass: { popup: 'rounded-4 shadow' }
              }).then(function () {
                isGaleriLoaded = false;
                loadGaleriData();
              });
            } else {
              Swal.fire({
                icon: 'error',
                title: 'Gagal Hapus',
                text: (res ? res.message : 'Tidak ada respon dari server'),
                customClass: { popup: 'rounded-4 shadow' }
              });
              loadGaleriData();
            }
          })
          .withFailureHandler(function (err) {
            Swal.fire({
              icon: 'error',
              title: 'Error Server',
              text: err.message,
              customClass: { popup: 'rounded-4 shadow' }
            });
            loadGaleriData();
          })
          .deleteGaleriData(rowIndex);
      }
    });
  } else {
    // Fallback jika SweetAlert2 belum terload di HTML
    if (confirm("Apakah Anda yakin ingin menghapus foto ini?")) {
      var cardElem = document.getElementById('galeri-card-' + rowIndex);
      if (cardElem) cardElem.style.opacity = '0.3';

      google.script.run
        .withSuccessHandler(function () {
          isGaleriLoaded = false;
          loadGaleriData();
        })
        .deleteGaleriData(rowIndex);
    }
  }
}

function filterGaleriCards() {
  var kat = document.getElementById('filterKategoriGaleri').value;
  if (!kat) {
    renderGaleriCards(rawGaleriData);
  } else {
    var filtered = rawGaleriData.filter(function (item) {
      return item.kategori === kat;
    });
    renderGaleriCards(filtered);
  }
}

function openPreviewFotoModal(arrayIndex) {
  var item = rawGaleriData[arrayIndex];
  if (!item) return;

  var displayUrl = getFormattedImageUrl(item.url);

  document.getElementById('previewFotoJudul').textContent = item.judul;
  document.getElementById('previewFotoImg').src = displayUrl;
  document.getElementById('previewFotoMeta').textContent = item.kategori + ' • ' + item.tanggal + ' • Oleh: ' + (item.pengunggah || 'Admin');
  document.getElementById('previewFotoDeskripsi').textContent = item.deskripsi || 'Tidak ada deskripsi.';

  var modalEl = document.getElementById('modalPreviewFoto');
  if (modalEl && typeof bootstrap !== 'undefined') {
    var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    modal.show();
  }
}

function submitGaleri(e) {
  if (e) e.preventDefault();

  try {
    var fileInput = document.getElementById('galeriFileInput');
    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
      alert("Pilih file foto terlebih dahulu!");
      return;
    }

    var file = fileInput.files[0];
    if (file.size > 3 * 1024 * 1024) {
      alert("Ukuran foto terlalu besar! Maksimal 3MB.");
      return;
    }

    var elJudul = document.getElementById('galeriJudul');
    var elKategori = document.getElementById('galeriKategori');
    var elTanggal = document.getElementById('galeriTanggal');
    var elDeskripsi = document.getElementById('galeriDeskripsi');

    if (!elJudul || !elKategori || !elTanggal) {
      alert("Form belum lengkap atau ada input yang tidak ditemukan di HTML!");
      return;
    }

    if (typeof Swal !== 'undefined') {
      Swal.fire({
        title: 'Mengompres & Memproses Foto...',
        text: 'Mohon tunggu sebentar...',
        allowOutsideClick: false,
        didOpen: function () { Swal.showLoading(); }
      });
    }

    var reader = new FileReader();
    reader.onload = function (evt) {
      var base64Data = evt.target.result;

      var payload = {
        judul: elJudul.value,
        kategori: elKategori.value,
        url: base64Data,
        tanggal: elTanggal.value,
        deskripsi: elDeskripsi ? elDeskripsi.value : ''
      };

      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) {
            if (typeof Swal !== 'undefined') {
              Swal.fire('Berhasil!', res.message, 'success').then(function () {
                var form = document.getElementById('formTambahGaleri');
                if (form) form.reset();

                var modalEl = document.getElementById('modalTambahGaleri');
                if (modalEl && typeof bootstrap !== 'undefined') {
                  var modal = bootstrap.Modal.getInstance(modalEl);
                  if (modal) modal.hide();
                }
                isGaleriLoaded = false;
                loadGaleriData();
              });
            } else {
              alert(res.message);
              isGaleriLoaded = false;
              loadGaleriData();
            }
          } else {
            var msg = (res && res.message) ? res.message : 'Gagal menyimpan foto.';
            if (typeof Swal !== 'undefined') Swal.fire('Gagal', msg, 'error');
            else alert('Gagal: ' + msg);
          }
        })
        .withFailureHandler(function (err) {
          if (typeof Swal !== 'undefined') Swal.fire('Error', err.message, 'error');
          else alert('Error: ' + err.message);
        })
        .saveGaleriData(payload);
    };

    reader.readAsDataURL(file);

  } catch (err) {
    console.error("Error submitGaleri:", err);
    alert("Terjadi kesalahan: " + err.message);
  }
}
</script>
