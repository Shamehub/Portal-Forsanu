<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Web - Alumni & Kas</title>
    <style>
        /* Menghilangkan margin/padding bawaan browser */
        html, body {
            margin: 0;
            padding: 0;

            height: 100%;
            overflow: hidden; /* Mencegah double scrollbar */
            background-color: #f4f6f9;

        /* Membuat iframe mengisi seluruh halaman */
        .app-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Masukkan Web App URL dari Google Apps Script di sini -->

        src="https://script.google.com/macros/s/AKfycbwZr2IiXdiMoqgSx56LLZOA2BMUxpgpiuA6Jg28PWXTxWVzSDPvrEuM-lteM9riWsIlsw/exec"

        title="Aplikasi Sistem Alumni">

</html>
