  let chartTahunLulusObj = null;

/**
 * Mengambil & Mengintegrasikan seluruh data Dashboard dari Google Sheet
 */
function initDashboardData() {
  // 1. Load Data Alumni & Olah Grafik + Jumlah
  google.script.run.withSuccessHandler(function(dataAlumni) {
    processAlumniDashboard(dataAlumni);
  }).getAlumniData();

  // 2. Load Data Kas Keuangan
  google.script.run.withSuccessHandler(function(resKas) {
    if (resKas && resKas.success) {
      let saldo = resKas.saldoAkhir || 0;
      document.getElementById("dashSaldoKas").innerText = "Rp " + saldo.toLocaleString("id-ID");
    }
  }).getKasData();

  // 3. Load Data Galeri Terbaru
  google.script.run.withSuccessHandler(function(resGaleri) {
    if (resGaleri && resGaleri.success) {
      renderDashboardGaleri(resGaleri.list || []);
    }
  }).getGaleriData();
}

/**
 * Mengolah Statistik Alumni & Render Grafik Batang
 */
function processAlumniDashboard(data) {
  let total = data.length;
  let laki = 0;
  let perempuan = 0;

  let countTahun = {};
  let countKecamatan = {};

  data.forEach(function(row) {
    // Hitung Gender
    let jk = String(row["Jenis Kelamin"] || "").trim().toLowerCase();
    if (jk === "laki-laki" || jk === "l") {
      laki++;
    } else if (jk === "perempuan" || jk === "p") {
      perempuan++;
    }

    // Hitung Tahun Lulus
    let thn = String(row["Tahun Lulus"] || "Lainnya").trim();
    if (thn && thn !== "-") {
      countTahun[thn] = (countTahun[thn] || 0) + 1;
    }

    // Hitung Kecamatan
    let kec = String(row["Kecamatan"] || "Lainnya").trim();
    if (kec && kec !== "-") {
      // Capitalize Format
      kec = kec.toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
      countKecamatan[kec] = (countKecamatan[kec] || 0) + 1;
    }
  });

  // Render Angka ke Card Dashboard
  document.getElementById("dashTotalAlumni").innerText = total;
  document.getElementById("dashAlumniLaki").innerText = laki;
  document.getElementById("dashAlumniPerempuan").innerText = perempuan;

  // Render Chart Tahun Lulus
  renderChartTahunLulus(countTahun);

  // Render Chart Kecamatan
  renderChartKecamatan(countKecamatan);
}

/**
 * Render Grafik Batang Tahun Lulus
 */
function renderChartTahunLulus(dataObj) {
  let ctx = document.getElementById('chartTahunLulus').getContext('2d');
  let labels = Object.keys(dataObj).sort();
  let values = labels.map(key => dataObj[key]);

  if (chartTahunLulusObj) chartTahunLulusObj.destroy();

  chartTahunLulusObj = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Jumlah Alumni',
        data: values,
        backgroundColor: '#198754',
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { stepSize: 1 } }
      }
    }
  });
}

/**
 * Render Grafik Batang Kecamatan
 */
function renderChartKecamatan(dataObj) {
  let ctx = document.getElementById('chartKecamatan').getContext('2d');
  let labels = Object.keys(dataObj);
  let values = labels.map(key => dataObj[key]);

  if (chartKecamatanObj) chartKecamatanObj.destroy();

  chartKecamatanObj = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Jumlah Alumni',
        data: values,
        backgroundColor: '#0d6efd',
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { stepSize: 1 } }
      }
    }
  });
}

/**
 * Render Carousel Galeri Otomatis
 */
function renderDashboardGaleri(list) {
  let container = document.getElementById("dashGaleriContainer");
  if (!list || list.length === 0) {
    container.innerHTML = `
      <div class="carousel-item active">
        <div class="d-flex justify-content-center align-items-center bg-light rounded" style="height: 300px;">
          <p class="text-muted mb-0">Belum ada foto galeri yang diunggah.</p>
        </div>
      </div>`;
    return;
  }

  let html = "";
  // Ambil maksimal 5 foto paling baru
  let maxPhotos = list.slice(0, 5);

  maxPhotos.forEach((item, index) => {
    let activeClass = index === 0 ? "active" : "";
    let imgUrl = item.url || "https://via.placeholder.com/800x400?text=No+Image";
    
    html += `
      <div class="carousel-item ${activeClass}">
        <div style="position: relative; height: 350px; background-color: #000;">
          <img src="${imgUrl}" class="d-block w-100 h-100" style="object-fit: cover; opacity: 0.85;" alt="${item.judul}">
          <div class="carousel-caption d-block text-start p-3 rounded" style="background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px); bottom: 15px; left: 15px; right: 15px;">
            <span class="badge bg-success mb-1">${item.kategori || 'Kegiatan'}</span>
            <h6 class="fw-bold text-white mb-1">${item.judul || 'Dokumentasi FORSANU'}</h6>
            <small class="text-white-50 d-block">${item.deskripsi || ''}</small>
          </div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

/**
 * MEMERIKSA DAN MENERAPKAN MODE AKSES (TAMU / ADMIN)
 */
function initAccessMode() {
  var isAdmin = sessionStorage.getItem('isAdminLoggedIn') === 'true';
  if (isAdmin) {
    document.body.classList.add('is-admin');
  } else {
    document.body.classList.remove('is-admin');
  }

  // TAMBAHKAN BARIS INI:
  updateAdminUI(); 
}

function safeReloadPage() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(url) {
        window.open(url, '_top');
      })
      .withFailureHandler(function() {
        window.location.reload();
      })
      .getScriptUrl();
  } else {
    window.location.reload();
  }
}

/**
 * DIPANGGIL SAAT LOGIN ADMIN BERHASIL
 */
function onAdminLoginSuccess() {
  // Simpan status login di session browser
  sessionStorage.setItem('isAdminLoggedIn', 'true');
  
  // Aktifkan mode admin di body
  document.body.classList.add('is-admin');
  
  // Perbarui antarmuka pengguna
  updateAdminUI(true);
}

/**
 * FUNGSI LOGOUT ADMIN (KEMBALI KE MODE READ-ONLY)
 */
function adminLogout() {
  Swal.fire({
    title: 'Keluar Mode Admin?',
    text: 'Aplikasi akan dimuat ulang ke Mode Read-Only.',
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'Ya, Logout',
    confirmButtonColor: '#dc3545',
    customClass: { popup: 'rounded-4' }
  }).then((result) => {
    if (result.isConfirmed) {
      sessionStorage.removeItem('isAdminLoggedIn');
      Swal.fire({
        icon: 'info',
        title: 'Logout Berhasil',
        text: 'Memuat ulang halaman...',
        timer: 1000,
        showConfirmButton: false,
        customClass: { popup: 'rounded-4' }
      }).then(() => {
        safeReloadPage();
      });
    }
  });
}

/**
 * HELPER: MENGATUR TAMPILAN ELEMEN UI SPESIFIK
 */
function updateAdminUI() {
  var isAdmin = sessionStorage.getItem('isAdminLoggedIn') === 'true';
  var btnNav = document.getElementById('btnNavAdmin');

  // Jika tombol tidak ditemukan lewat ID, cari via atribut onclick
  if (!btnNav) {
    btnNav = document.querySelector('a[onclick*="AdminModal"]') || 
             document.querySelector('a[onclick*="adminLogout"]') ||
             document.querySelector('a[onclick*="openAdminLoginModal"]');
  }

  if (btnNav) {
    if (isAdmin) {
      // Ubah Tombol Menjadi Logout Admin
      btnNav.setAttribute('onclick', 'adminLogout()');
      btnNav.innerHTML = `<i class="fa-solid fa-right-from-bracket fs-5"></i> <span>Logout Admin</span>`;
      btnNav.classList.remove('text-warning');
      btnNav.classList.add('text-danger');
    } else {
      // Ubah Tombol Menjadi Login Admin
      btnNav.setAttribute('onclick', 'openAdminLoginModal()');
      btnNav.innerHTML = `<i class="fa-solid fa-user-shield fs-5"></i> <span>Login Admin</span>`;
      btnNav.classList.remove('text-danger');
      btnNav.classList.add('text-warning');
    }
  }
}

  // ------------------------------------------------------------------
  // ROUTER NAVIGATION
  // ------------------------------------------------------------------
  function navigateTo(viewName) {
    var views = document.querySelectorAll('.page-view');
    for (var i = 0; i < views.length; i++) {
      views[i].classList.add('d-none');
    }

    var menus = document.querySelectorAll('#sidebar li');
    for (var j = 0; j < menus.length; j++) {
      menus[j].classList.remove('active');
    }

    var targetView = document.getElementById('view-' + viewName);
    if (targetView) targetView.classList.remove('d-none');

    var targetMenu = document.getElementById('menu-' + viewName);
    if (targetMenu) targetMenu.classList.add('active');

    var sidebar = document.getElementById('sidebar');
    if (sidebar && window.innerWidth <= 768) sidebar.classList.remove('active');

    // TRIGGER MASUK KTA DAAN NAVIGASI OPTIMASI CACHE
    if (viewName === 'kta') {
      initKTAModule();
    } else if (viewName === 'alumni') {
      if (!isAlumniLoaded || rawAlumniData.length === 0) loadAlumniData(true);
      else renderAlumniCards(rawAlumniData);
    } else if (viewName === 'kas') {
      if (!isKasLoaded || rawKasData.length === 0) loadKasData();
      else renderKasTable(filteredKasData.length > 0 ? filteredKasData : rawKasData);
    } else if (viewName === 'kajian') {
      if (!isKajianLoaded || rawKajianData.length === 0) loadKajianData();
    } else if (viewName === 'galeri') {
      if (!isGaleriLoaded || rawGaleriData.length === 0) loadGaleriData();
      else renderGaleriCards(rawGaleriData);
    } else if (viewName === 'saran') {
      if (!isSaranLoaded || rawSaranData.length === 0) loadSaranData();
    }
  }

  /**
   * Helper: Mencari nilai dari object berdasarkan kata kunci nama kolom (Case-Insensitive)
   */
  function getFieldValue(item, possibleKeys) {
  if (!item || typeof item !== 'object') return '';
  
  // 1. Pencarian langsung (Direct Match)
  for (var i = 0; i < possibleKeys.length; i++) {
    var k = possibleKeys[i];
    if (item[k] !== undefined && item[k] !== null && item[k] !== '') {
      return item[k];
    }
  }

  // 2. Pencarian fleksibel (Case-Insensitive & Partial Match)
  var itemKeys = Object.keys(item);
  for (var j = 0; j < possibleKeys.length; j++) {
    var targetKey = possibleKeys[j].toLowerCase();
    for (var k = 0; k < itemKeys.length; k++) {
      if (itemKeys[k].toLowerCase().includes(targetKey)) {
        var val = item[itemKeys[k]];
        if (val !== undefined && val !== null && val !== '') {
          return val;
        }
      }
    }
  }

  return '';
}

  /**
   * POPULATE DROPDOWN ALUMNI DENGAN DETEKSI HEADER FLEKSIBEL
   */
  function populateAlumniDropdownKTA() {
  var select = document.getElementById('selectAlumniKTA');
  if (!select) return;

  select.innerHTML = '<option value="">-- Pilih Alumni --</option>';

  if (!rawAlumniData || rawAlumniData.length === 0) {
    select.innerHTML = '<option value="">-- Data Alumni Kosong --</option>';
    return;
  }

  // 1. Petakan data beserta index aslinya agar saat dipillih KTA tidak tertukar
  var listSorted = rawAlumniData.map(function (item, originalIndex) {
    var nama = getFieldValue(item, ['nama', 'Nama', 'NAMA', 'nama_lengkap', 'Nama Lengkap']) || 'Tanpa Nama';
    var angkatan = getFieldValue(item, ['angkatan', 'Angkatan', 'tahun_lulus', 'Tahun Lulus', 'Tahun', 'lulus']) || '-';
    
    return {
      index: originalIndex,
      nama: nama.trim(),
      angkatan: angkatan.toString().trim()
    };
  });

  // 2. Sortir berdasarkan abjad nama (A-Z)
  listSorted.sort(function (a, b) {
    return a.nama.localeCompare(b.nama, 'id', { sensitivity: 'base' });
  });

  // 3. Masukkan ke elemen <select>
  listSorted.forEach(function (item) {
    var opt = document.createElement('option');
    opt.value = item.index; // Menggunakan index asli
    opt.textContent = item.nama + ' (' + item.angkatan + ')';
    select.appendChild(opt);
  });
}

  /**
   * FUNGSI FORMAT TANGGAL KE INDONESIA (Contoh: 2026-07-12 -> 12 Juli 2026)
   */
  function formatTanggalIndo(dateStr) {
  if (!dateStr || dateStr === '-') return '';
  var match = dateStr.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if (match) {
    var tahun = match[1];
    var bulanIdx = parseInt(match[2], 10) - 1;
    var tgl = parseInt(match[3], 10);
    var namaBulan = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];
    if (bulanIdx >= 0 && bulanIdx < 12) {
      return tgl + ' ' + namaBulan[bulanIdx] + ' ' + tahun;
    }
  }
  return dateStr;
}

  /**
   * LIVE PREVIEW KTA SAAT ALUMNI DIPILIH / MERUBAH DATA KTA
   */
  function previewKTACard() {
  var select = document.getElementById('selectAlumniKTA');
  var index = select ? select.value : '';

  if (index === '' || !rawAlumniData || !rawAlumniData[index]) {
    document.getElementById('kta-nama').innerText = '-';
    document.getElementById('kta-nta').innerText = '-';
    document.getElementById('kta-tahun-lulus').innerText = '-';
    document.getElementById('kta-ttl').innerText = '-';
    document.getElementById('kta-alamat').innerText = '-';
    document.getElementById('kta-foto').src = 'https://via.placeholder.com/110x145/cccccc/FFFFFF?text=No+Foto';
    document.getElementById('kta-qrcode').src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=FORSANU';
    return;
  }

  var item = rawAlumniData[index];
  var nama = getFieldValue(item, ['nama', 'Nama', 'NAMA', 'nama_lengkap', 'Nama Lengkap']) || '-';
  var nta = getFieldValue(item, ['nia', 'NIA', 'nta', 'NTA', 'id', 'ID', 'no_anggota']) || ('ALM-' + (parseInt(index) + 949600));
  var tahunLulus = getFieldValue(item, ['tahun_lulus', 'Tahun Lulus', 'tahunLulus', 'thn_lulus', 'Thn Lulus', 'lulusan', 'Lulusan', 'angkatan', 'Angkatan']) || '-';

  var tempatLahir = getFieldValue(item, ['tempat_lahir', 'Tempat Lahir', 'tempat', 'Tempat']) || '';
  var tglLahirRaw = getFieldValue(item, ['tanggal_lahir', 'Tanggal Lahir', 'tgl_lahir', 'Tgl Lahir', 'ttl', 'TTL']) || '';
  var tglLahirFormatted = formatTanggalIndo(tglLahirRaw);

  var ttl = '-';
  if (tempatLahir && tglLahirFormatted) ttl = tempatLahir + ', ' + tglLahirFormatted;
  else if (tempatLahir) ttl = tempatLahir;
  else if (tglLahirFormatted) ttl = tglLahirFormatted;

  var desa = getFieldValue(item, ['desa', 'Desa', 'kelurahan', 'Kelurahan']) || '';
  var kecamatan = getFieldValue(item, ['kecamatan', 'Kecamatan', 'kec', 'Kec']) || '';
  var kabupaten = getFieldValue(item, ['kabupaten', 'Kabupaten', 'kota', 'Kota', 'kab', 'Kab']) || '';

  var formattedAlamat = '';
  if (desa || kecamatan || kabupaten) {
    var komp = [];
    if (desa) komp.push(desa);
    if (kecamatan) komp.push(kecamatan);
    if (kabupaten) komp.push(kabupaten);
    formattedAlamat = komp.join(' - ');
  } else {
    var alamatSatu = getFieldValue(item, ['alamat', 'Alamat', 'ALAMAT', 'alamat_lengkap']);
    formattedAlamat = (alamatSatu && alamatSatu !== '-') ? alamatSatu : '-';
  }

  var foto = getFieldValue(item, ['foto', 'Foto', 'FOTO', 'url_foto', 'pas_foto']) || 'https://via.placeholder.com/110x145/cccccc/FFFFFF?text=No+Foto';
  var logoFromSheet = getFieldValue(item, ['logo', 'Logo', 'url_logo']);
  var logoUrl = (typeof URL_LOGO !== 'undefined' && URL_LOGO) ? URL_LOGO : (logoFromSheet || '');
  if (!logoUrl || logoUrl === '-') logoUrl = 'https://via.placeholder.com/80x50/074726/FFFFFF?text=LOGO';

  document.getElementById('kta-nama').innerText = nama;
  document.getElementById('kta-nta').innerText = nta;
  document.getElementById('kta-tahun-lulus').innerText = tahunLulus;
  document.getElementById('kta-ttl').innerText = ttl;
  document.getElementById('kta-alamat').innerText = formattedAlamat;
  document.getElementById('kta-foto').src = foto;
  document.getElementById('kta-logo').src = logoUrl;

  var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent('NIA: ' + nta + '\nNama: ' + nama);
  document.getElementById('kta-qrcode').src = qrUrl;
}

  /**

function prosesCetakPDF(namaAlumni) {
  // Loading Alert
  Swal.fire({
    title: 'Mencetak KTA...',
    text: 'Mohon tunggu sebentar...',
    allowOutsideClick: false,
    didOpen: function () { Swal.showLoading(); }
  });

  // Gunakan requestAnimationFrame / setTimeout agar UI tidak membeku saat rendering
  setTimeout(function() {
    var cardFront = document.getElementById('kta-card-front');
    var cardBack = document.getElementById('kta-card-back');

    // OPSI OPTIMASI: Scale 2 sudah sangat tajam untuk cetak kartu (jauh lebih ringan dari scale 3)
    var canvasOptions = { 
      scale: 2, 
      useCORS: true, 
      allowTaint: false, 
      logging: false,
      backgroundColor: null // Mengabaikan render background ekstra
    };

    // Render Halaman Depan
    html2canvas(cardFront, canvasOptions).then(function (canvasFront) {
      // Render Halaman Belakang
      html2canvas(cardBack, canvasOptions).then(function (canvasBack) {
        
        var { jsPDF } = window.jspdf;
        // Inisialisasi PDF dengan kompresi aktif
        var doc = new jsPDF({
          orientation: 'l',
          unit: 'mm',
          format: [85.6, 53.9],
          compress: true // Mengompresi file agar ukuran PDF kecil & proses render lancar
        });

        // Gunakan kompresi 'FAST' pada penambahan gambar
        doc.addImage(canvasFront.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, 85.6, 53.9, undefined, 'FAST');
        doc.addPage([85.6, 53.9], 'l');
        doc.addImage(canvasBack.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, 85.6, 53.9, undefined, 'FAST');

        // Simpan File PDF
        var namaClean = namaAlumni.replace(/[^a-zA-Z0-9]/g, '_');
        doc.save('KTA_' + namaClean + '.pdf');

        Swal.close();
        Swal.fire({
          icon: 'success',
          title: 'Berhasil!',
          text: 'Kartu Anggota Alumni berhasil diunduh.',
          timer: 1500,
          showConfirmButton: false,
          customClass: { popup: 'rounded-4' }
        });
      }).catch(handleRenderError);
    }).catch(handleRenderError);
  }, 100);
}

function handleRenderError(err) {
  Swal.close();
  Swal.fire('Error', 'Gagal memproses gambar KTA: ' + err.message, 'error');
}

  function toTitleCase(str) {

  }

  function compressImage(file, maxWidth, maxHeight, quality, callback) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var width = img.width;
        var height = img.height;

        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }

        var canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;

        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        var dataUrl = canvas.toDataURL('image/jpeg', quality);
        callback(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function filterAlumni() {
    var searchInput = document.getElementById('searchAlumniInput');
    var keyword = searchInput ? searchInput.value.toLowerCase() : "";

    var selectLulus = document.getElementById('filterTahunLulus');
    var thnFilter = selectLulus ? selectLulus.value : "";

    var selectGender = document.getElementById('filterGender');
    var genderFilter = selectGender ? selectGender.value : "";

    // 1. Ambil nilai sortir (A-Z atau Z-A)
    var selectSort = document.getElementById('sortAlumniOrder');
    var sortOrder = selectSort ? selectSort.value : "ASC";

    var filtered = [];
    for (var i = 0; i < rawAlumniData.length; i++) {
      var a = rawAlumniData[i];
      var nama = (a["Nama Lengkap"] || "").toLowerCase();
      var panggilan = (a["Panggilan"] || "").toLowerCase();
      var desa = (a["Desa"] || "").toLowerCase();
      var kecamatan = (a["Kecamatan"] || "").toLowerCase();
      var profesi = (a["Profesi"] || "").toLowerCase();
      var thnLulus = (a["Tahun Lulus"] || "").toString();
      var gender = (a["Jenis Kelamin"] || "");

      var matchSearch = !keyword || (nama.indexOf(keyword) !== -1 || panggilan.indexOf(keyword) !== -1 || desa.indexOf(keyword) !== -1 || kecamatan.indexOf(keyword) !== -1 || profesi.indexOf(keyword) !== -1);
      var matchLulus = !thnFilter || (thnLulus === thnFilter);
      var matchGender = !genderFilter || (gender === genderFilter);

      if (matchSearch && matchLulus && matchGender) {
        filtered.push(a);
      }
    }

    // 2. PROSES SORTIR DATA (A-Z / Z-A)
    filtered.sort(function (a, b) {
      var namaA = (a["Nama Lengkap"] || "").toString().trim().toUpperCase();
      var namaB = (b["Nama Lengkap"] || "").toString().trim().toUpperCase();

      if (sortOrder === "DESC") {
        return namaB.localeCompare(namaA, 'id', { sensitivity: 'base' });
      } else {
        return namaA.localeCompare(namaB, 'id', { sensitivity: 'base' });
      }
    });

    // 3. Tampilkan hasil yang sudah difilter dan disortir
    renderAlumniCards(filtered);
}

  function processCSVImport(event) {
    var file = event.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (e) {
      var text = e.target.result;
      var parsedRows = parseCSVText(text);

      if (parsedRows.length < 2) {
        Swal.fire('Error', 'File CSV harus memiliki header dan minimal 1 baris data!', 'error');
        return;
      }

      Swal.fire({
        title: 'Konfirmasi Import',
        text: 'Ingin mengimpor ' + (parsedRows.length - 1) + ' data alumni ke spreadsheet?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Ya, Import Data',
        cancelButtonText: 'Batal',
        confirmButtonColor: '#198754'
      }).then(function (res) {
        if (res.isConfirmed) {
          Swal.fire({
            title: 'Mengimpor Data...',
            text: 'Data sedang dikirim dan ditulis ke spreadsheet...',
            allowOutsideClick: false,
            didOpen: function () { Swal.showLoading(); }
          });

          google.script.run
            .withSuccessHandler(function (response) {
              if (response.success) {
                Swal.fire('Berhasil!', response.message, 'success').then(function () {
                  loadAlumniData(true);
                });
              } else {
                Swal.fire('Gagal Import', response.message, 'error');
              }
            })
            .withFailureHandler(function (err) {
              Swal.fire('Server Error', err.message, 'error');
            })
            .importCSVData(parsedRows);
        }
      });
    };
    reader.readAsText(file);
  }

  function formatCSVCell(cell) {
    cell = cell.toString().replace(/"/g, '""');
    if (cell.search(/("|,|\n)/g) >= 0) {
      cell = '"' + cell + '"';
    }
    return cell;
  }

  function downloadCSVFile(csvContent, fileName) {
    var blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement("a");
    var url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", fileName);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function parseCSVText(text) {
    var lines = text.split(/\r\n|\n/);
    var result = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line) {
        var row = [];
        var insideQuote = false;
        var entry = '';
        for (var j = 0; j < line.length; j++) {
          var char = line[j];
          if (char === '"') {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            row.push(entry.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
        result.push(row);
      }
    }
    return result;
  }

  var rawKasData = [];

  function filterKasData() {
    var filterBulan = document.getElementById('kasFilterBulan') ? document.getElementById('kasFilterBulan').value : '';
    var filterTahun = document.getElementById('kasFilterTahun') ? document.getElementById('kasFilterTahun').value : '';

    if (!rawKasData || rawKasData.length === 0) return;

    filteredKasData = rawKasData.filter(function (item) {
      if (!item.tanggal) return false;
      var parts = item.tanggal.split('-');
      var yr = parts[0];
      var mo = parts[1];

      var matchBulan = !filterBulan || mo === filterBulan;
      var matchTahun = !filterTahun || yr === filterTahun;

      return matchBulan && matchTahun;
    });

    renderKasTable(filteredKasData);
  }

  function renderKasTable(dataList) {
    var tbody = document.getElementById('kasTableBody');
    if (!tbody) return;

    var totalMasuk = 0;
    var totalKeluar = 0;

    if (!dataList || dataList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Tidak ada transaksi yang sesuai filter.</td></tr>';
      
      var elMasuk = document.getElementById('kasTotalPemasukan');
      var elKeluar = document.getElementById('kasTotalPengeluaran');
      var elSaldo = document.getElementById('kasSaldoAkhir');
      if (elMasuk) elMasuk.textContent = formatRupiah(0);
      if (elKeluar) elKeluar.textContent = formatRupiah(0);
      if (elSaldo) elSaldo.textContent = formatRupiah(0);
      return;
    }

    var html = '';
    dataList.forEach(function (item, idx) {
      var isMasuk = item.jenis === 'Pemasukan';
      var jumlahNum = parseFloat(item.jumlah) || 0;

      if (isMasuk) totalMasuk += jumlahNum;
      else totalKeluar += jumlahNum;

      var badgeClass = isMasuk ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger';
      var nominalClass = isMasuk ? 'text-success fw-bold' : 'text-danger fw-bold';
      var prefix = isMasuk ? '+ ' : '- ';

      html += '<tr>' +
        '<td>' + (idx + 1) + '</td>' +
        '<td>' + item.tanggal + '</td>' +
        '<td><span class="badge ' + badgeClass + '">' + item.jenis + '</span></td>' +

  function getLogoBase64(callback) {
    var logoImg = document.getElementById('appLogo') || document.querySelector('.navbar-brand img');

    if (!logoImg || !logoImg.src) {
      callback(null);
      return;
    }

    if (logoImg.src.startsWith('data:image')) {
      callback(logoImg.src);
      return;
    }

    var img = new Image();
    img.crossOrigin = 'Anonymous';
    img.onload = function () {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        var dataURL = canvas.toDataURL('image/png');
        callback(dataURL);
      } catch (e) {
        callback(null);
      }
    };
    img.onerror = function () {
      callback(null);
    };
    img.src = logoImg.src;
  }

  function exportKasToPDF() {
    if (typeof window.jspdf === 'undefined') {
      Swal.fire('Error', 'Library PDF belum dimuat. Periksa CDN jsPDF.', 'error');
      return;
    }

    var dataToExport = (filteredKasData && filteredKasData.length > 0) ? filteredKasData : rawKasData;

    if (!dataToExport || dataToExport.length === 0) {
      Swal.fire('Peringatan', 'Tidak ada data transaksi kas untuk diexport!', 'warning');
      return;
    }

    Swal.fire({
      title: 'Menyiapkan PDF...',
      text: 'Memproses logo dan data laporan...',
      allowOutsideClick: false,
      didOpen: function () { Swal.showLoading(); }
    });

    getLogoBase64(function (logoBase64) {
      setTimeout(function () {
        try {
          var { jsPDF } = window.jspdf;
          var doc = new jsPDF('p', 'mm', 'a4');

          var totalMasuk = 0;
          var totalKeluar = 0;

          doc.setFillColor(25, 135, 84);
          doc.rect(0, 0, 210, 38, 'F');

          var textStartX = 14;
          if (logoBase64) {
            try {
              doc.addImage(logoBase64, 'PNG', 12, 6, 25, 25);
              textStartX = 42;
            } catch (errLogo) {
              console.error(errLogo);
            }
          }

          doc.setTextColor(255, 255, 255);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(16);
          doc.text("LAPORAN KEUANGAN & KAS ALUMNI", textStartX, 17);

          doc.setFont('helvetica', 'normal');
          doc.setFontSize(10);
          doc.text("Forum Silaturahmi Alumni (FORSANU)", textStartX, 24);
          doc.text("Tanggal Cetak: " + new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }), textStartX, 30);

          var tableBody = [];
          dataToExport.forEach(function (item, index) {
            var jumlah = parseFloat(item.jumlah) || 0;
            var isMasuk = item.jenis === 'Pemasukan';

            if (isMasuk) totalMasuk += jumlah;
            else totalKeluar += jumlah;

            tableBody.push([
              index + 1,
              item.tanggal || '-',
              item.jenis || '-',
              item.kategori || '-',
              item.keterangan || '-',
              item.petugas || '-',
              (isMasuk ? '+ ' : '- ') + formatRupiah(jumlah)
            ]);
          });

          var saldoAkhir = totalMasuk - totalKeluar;

          tableBody.push([
            { content: 'TOTAL PEMASUKAN', colSpan: 6, styles: { halign: 'right', fontStyle: 'bold', textColor: [25, 135, 84] } },
            { content: formatRupiah(totalMasuk), styles: { fontStyle: 'bold', textColor: [25, 135, 84] } }
          ]);
          tableBody.push([
            { content: 'TOTAL PENGELUARAN', colSpan: 6, styles: { halign: 'right', fontStyle: 'bold', textColor: [220, 53, 69] } },
            { content: formatRupiah(totalKeluar), styles: { fontStyle: 'bold', textColor: [220, 53, 69] } }
          ]);
          tableBody.push([
            { content: 'SALDO AKHIR', colSpan: 6, styles: { halign: 'right', fontStyle: 'bold', fillColor: [240, 240, 240] } },
            { content: formatRupiah(saldoAkhir), styles: { fontStyle: 'bold', fillColor: [240, 240, 240] } }
          ]);

          doc.autoTable({
            startY: 45,
            head: [['No', 'Tanggal', 'Jenis', 'Kategori', 'Keterangan', 'Petugas', 'Nominal']],
            body: tableBody,
            theme: 'striped',
            headStyles: { fillColor: [33, 37, 41], textColor: [255, 255, 255], fontStyle: 'bold', halign: 'center' },
            columnStyles: {
              0: { halign: 'center', cellWidth: 10 },
              1: { halign: 'center', cellWidth: 25 },
              2: { halign: 'center', cellWidth: 25 },
              3: { cellWidth: 30 },
              4: { cellWidth: 45 },
              5: { cellWidth: 25 },
              6: { halign: 'right', cellWidth: 30 }
            },
            styles: { fontSize: 8, cellPadding: 2.5, valign: 'middle' },
            didParseCell: function (data) {
              if (data.section === 'body' && data.column.index === 6) {
                var val = data.cell.raw;
                if (typeof val === 'string' && val.indexOf('+') !== -1) {
                  data.cell.styles.textColor = [25, 135, 84];
                } else if (typeof val === 'string' && val.indexOf('-') !== -1) {
                  data.cell.styles.textColor = [220, 53, 69];
                }
              }
            }
          });

          var finalY = doc.lastAutoTable.finalY + 15;
          if (finalY > 250) {
            doc.addPage();
            finalY = 30;
          }

          doc.setFontSize(9);
          doc.setTextColor(100, 100, 100);
          doc.text("Mengetahui,", 150, finalY);
          doc.text("Bendahara Umum", 150, finalY + 15);
          doc.text("( ..................................... )", 150, finalY + 30);

          var fileName = "Laporan_Kas_FORSANU_" + new Date().toISOString().slice(0, 10) + ".pdf";
          doc.save(fileName);

          Swal.close();
          Swal.fire('Berhasil!', 'Laporan PDF Keuangan beserta logo telah diunduh.', 'success');
        } catch (err) {
          console.error(err);
          Swal.fire('Error PDF', err.message, 'error');
        }
      }, 300);
    });
  }

        container.innerHTML = '<div class="text-center text-muted py-5"><i class="fa-regular fa-comments fa-3x mb-3 d-block text-secondary"></i>Belum ada saran / masukan. Jadi yang pertama mengirim!</div>';
        return;
      }

      var mainMessages = [];
      var replies = [];

      rawSaranData.forEach(function (item) {
        if (!item.parentRow || item.parentRow === "" || item.parentRow === "-" || item.parentRow === 0) {
          mainMessages.push(item);
        } else {
          replies.push(item);
        }
      });

      if (mainMessages.length === 0 && rawSaranData.length > 0) {
        mainMessages = rawSaranData;
        replies = [];
      }

      var html = '';
      mainMessages.forEach(function (main) {
        var childReplies = replies.filter(function (r) { 
          return String(r.parentRow) === String(main.rowIndex); 
        });

        html += '<div class="card border-0 bg-light rounded-4 p-3 mb-3 shadow-sm">' +
          '<div class="d-flex justify-content-between align-items-start mb-2">' +
            '<div>' +
              '<h6 class="fw-bold text-dark mb-0"><i class="fa-solid fa-circle-user text-primary me-2"></i>' + (main.nama || 'Anonim') + '</h6>' +
              '<small class="text-muted" style="font-size:0.75rem;">' + (main.tanggal || '-') + ' • <span class="badge bg-primary-subtle text-primary">' + (main.kategori || 'Umum') + '</span></small>' +
            '</div>' +
            '<button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="confirmDeleteSaran(' + main.rowIndex + ')" title="Hapus Pesan">' +
              '<i class="fa-solid fa-trash-can"></i>' +
            '</button>' +
          '</div>' +
          
          '<p class="text-dark mb-2" style="font-size: 0.92rem; white-space: pre-line;">' + (main.pesan || '') + '</p>' +
          
          '<div class="d-flex justify-content-end mb-2">' +
            '<button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" style="font-size: 0.8rem;" onclick="openReplyModal(' + main.rowIndex + ')" title="Balas Pesan Ini">' +
              '<i class="fa-solid fa-reply me-1"></i> Balas' +
              '</button>' +
          '</div>';

        if (childReplies.length > 0) {
          html += '<div class="ms-4 border-start border-2 border-primary-subtle ps-3 mt-2">';
          childReplies.forEach(function (rep) {
            html += '<div class="bg-white p-2 rounded-3 mb-2 shadow-xs border">' +
              '<div class="d-flex justify-content-between align-items-center mb-1">' +
                '<strong class="small text-dark"><i class="fa-solid fa-user-check text-success me-1"></i>' + (rep.nama || 'Anonim') + '</strong>' +
                '<div>' +
                  '<span class="text-muted me-2" style="font-size:0.7rem;">' + (rep.tanggal || '-') + '</span>' +
                  '<button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="confirmDeleteSaran(' + rep.rowIndex + ')" title="Hapus Balasan">' +
                    '<i class="fa-solid fa-xmark"></i>' +
                  '</button>' +
                '</div>' +
              '</div>' +
              '<p class="small text-muted mb-0" style="white-space: pre-line;">' + (rep.pesan || '') + '</p>' +
            '</div>';
          });
          html += '</div>';
        }

        html += '</div>';
      });

      container.innerHTML = html;
    })
    .getSaranData();
}

    showCancelButton: true,
    confirmButtonColor: '#dc3545',

/**
 * FUNGSI SORTIR NAMA ALUMNI (A-Z / Z-A)
 */
function sortAndRenderAlumni() {
  var sortOrder = document.getElementById('sortAlumniOrder') ? document.getElementById('sortAlumniOrder').value : 'ASC';

  // 1. Cek variabel data alumni Anda (mencoba beberapa nama variabel yang umum digunakan)
  var alumniData = window.rawAlumniData || window.alumniData || window.dataAlumni || window.allAlumniData;

  if (!alumniData || !Array.isArray(alumniData) || alumniData.length === 0) {
    console.warn("Data alumni belum dimuat atau variabel data tidak ditemukan.");
    return;
  }

  // 2. Lakukan Sortir berdasarkan Nama
  alumniData.sort(function (a, b) {
    var namaA = String(a.nama || a.namaLengkap || a.Nama || '').trim().toUpperCase();
    var namaB = String(b.nama || b.namaLengkap || b.Nama || '').trim().toUpperCase();

    if (sortOrder === 'ASC') {
      return namaA.localeCompare(namaB, 'id', { sensitivity: 'base' });
    } else {
      return namaB.localeCompare(namaA, 'id', { sensitivity: 'base' });
    }
  });

  // 3. Panggil fungsi render/tampil ulang card list Anda
  // (Fungsi ini otomatis mencoba memanggil nama fungsi render card yang ada di project Anda)
  if (typeof renderAlumniCards === 'function') {
    renderAlumniCards(alumniData);
  } else if (typeof renderAlumniTable === 'function') {
    renderAlumniTable(alumniData);
  } else if (typeof renderAlumniData === 'function') {
    renderAlumniData(alumniData);
  } else if (typeof displayAlumni === 'function') {
    displayAlumni(alumniData);
  } else if (typeof loadAlumniUI === 'function') {
    loadAlumniUI(alumniData);
  } else {
    console.error("Fungsi untuk menampilkan/render card alumni tidak ditemukan. Harap sesuaikan nama fungsinya!");
  }
}

function triggerKTADownloadWithAuth() {

  var selectEl = document.getElementById('selectAlumniKTA') || document.querySelector('select');

      title: 'Pilih Alumni',
      text: 'Silakan pilih nama alumni terlebih dahulu!',
      customClass: { popup: 'rounded-4' }
    });
    return;
  }

  var selectedValue = selectEl.value.trim(); // Berisi nilai option (misal: ID/Nama)
  var dataSrc = typeof rawAlumniData !== 'undefined' ? rawAlumniData : null;

  if (!dataSrc || dataSrc.length === 0) {
    Swal.fire({ icon: 'error', title: 'Error', text: 'Data alumni belum dimuat dari server.' });
    return;
  }

  // 2. Cari data alumni yang cocok dari rawAlumniData
  targetDownloadAlumni = dataSrc.find(function(item) {
    if (!item) return false;

    var valKode = String(item["Kode Unik"] || item["ID"] || "").trim().toLowerCase();

    // Cocokkan apakah nilai dropdown sama dengan Nama/Kode/ID alumni
    return valNama === valSearch || valKode === valSearch || String(item._index) === valSearch;
  });

  if (!targetDownloadAlumni) {
    // Jika dropdown menyimpan format gabungan seperti "Mutoyarohhhhh (2011)", cari dengan substring/includes
    targetDownloadAlumni = dataSrc.find(function(item) {
      var nama = String(item["Nama Lengkap"] || "").trim().toLowerCase();
      return nama && selectedValue.toLowerCase().indexOf(nama) !== -1;
    });

  if (!targetDownloadAlumni) {

      icon: 'error',
      title: 'Gagal',
      text: 'Data detail alumni tidak ditemukan di sistem!',
      customClass: { popup: 'rounded-4' }
    });

    },

        Swal.showValidationMessage('Kode Unik wajib diisi!');

        Swal.fire('Gagal Verifikasi', 'Kode Unik salah/tidak cocok!', 'error');
      }
    }
  });
}
